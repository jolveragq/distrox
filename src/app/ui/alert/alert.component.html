@if (visible()) {
    <div class="p-4 rounded-md border"
    [ngClass]="{
        'bg-blue-50 text-blue-800 border-blue-200': variant() === 'info',
        'bg-green-50 text-green-800 border-green-200': variant() === 'success',
        'bg-yellow-50 text-yellow-800 border-yellow-200': variant() === 'warning',
        'bg-red-50 text-red-800 border-red-200': variant() === 'error',
        'p-2': size() === 'sm',
        'p-4': size() === 'md',
    }"
    >
      <div class="flex">
        <!-- Icono según variante -->
        <div class="flex-shrink-0">
          <ng-container [ngSwitch]="variant()">
            <svg *ngSwitchCase="'info'" class="w-5 h-5 text-blue-400" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                    d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
                    clip-rule="evenodd" />
            </svg>
            <svg *ngSwitchCase="'success'" class="w-5 h-5 text-green-400" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                    d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                    clip-rule="evenodd" />
            </svg>
            <svg *ngSwitchCase="'warning'" class="w-5 h-5 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                    d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z"
                    clip-rule="evenodd" />
            </svg>
            <svg *ngSwitchCase="'error'" class="w-5 h-5 text-red-400" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                    d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                    clip-rule="evenodd" />
            </svg>
          </ng-container>
        </div>

        <!-- Contenido de la alerta -->
        <div class="ml-3 flex-1">
          @if (title()) {
            <h3 class="text-sm font-medium">{{ title() }}</h3>
          }
          <div class="text-sm mt-1">
            <ng-content></ng-content>
          </div>
        </div>

        <!-- Botón dismissible -->
        @if (dismissible()) {
          <div class="pl-3 ml-auto">
            <button (click)="onDismiss()"
                    class="inline-flex text-gray-400 hover:text-gray-500 focus:outline-none focus:ring-2 focus:ring-offset-2"
                    [ngClass]="{
                        'focus:ring-blue-500': variant() === 'info',
                        'focus:ring-green-500': variant() === 'success',
                        'focus:ring-yellow-500': variant() === 'warning',
                        'focus:ring-red-500': variant() === 'error',
                    }"
                    aria-label="Dismiss">
              <span class="sr-only">Dismiss</span>
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
        }
      </div>
    </div>
  }
