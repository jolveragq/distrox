<button
      [disabled]="disabled()"
      class="inline-flex items-center justify-center font-medium rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 transition disabled:opacity-50 disabled:cursor-not-allowed"
      [ngClass]="buttonClasses()"
    >
      <ng-container *ngIf="hasStartIcon()">
        <i [class]="icon()" class="mr-2"></i>
      </ng-container>
      <ng-content></ng-content>
      <ng-container *ngIf="hasEndIcon()">
        <i [class]="icon()" class="ml-2"></i>
      </ng-container>
    </button>
